# İZ — statik analiz yapılandırması
#
# Amaç: hataları IDE'de, derlemeden önce yakalamak. Kurallar bilinçli olarak
# varsayılandan sıkı; çünkü bu proje uzun ömürlü ve çok fazlı (MVP → V3).
include: package:flutter_lints/flutter.yaml

analyzer:
  # Üretilen dosyalar analiz dışı — uyarıları gürültü yapar.
  exclude:
    - "**/*.g.dart"
    - "**/*.drift.dart"
    - "lib/core/l10n/generated/**"
    # drift_dev'in şema anlık görüntülerinden ürettiği yardımcılar.
    # Elle yazılmadı, elle düzeltilmeyecek (bkz. test/unit/migration_test.dart).
    - "test/generated_migrations/**"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  language:
    strict-casts: true        # dynamic'ten örtük cast yok
    strict-inference: true    # tip çıkarımı belirsizse hata
    strict-raw-types: true    # List yerine List<T> yaz

  errors:
    # Bunlar uyarı değil HATA olmalı — sessizce bug üretirler.
    invalid_annotation_target: ignore   # json_serializable ile gürültü yapar
    missing_required_param: error
    missing_return: error
    body_might_complete_normally_nullable: error
    unused_import: error
    unused_local_variable: warning
    dead_code: warning
    # await unutmak async kodda en sık görülen sessiz hatadır.
    unawaited_futures: error

linter:
  rules:
    # --- Doğruluk ------------------------------------------------------------
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true          # StreamSubscription sızıntısı
    close_sinks: true
    only_throw_errors: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    discarded_futures: true             # Future'ı yut ama bilerek yut

    # --- Performans / Flutter ------------------------------------------------
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    use_key_in_widget_constructors: true
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true
    avoid_unnecessary_containers: true

    # --- Okunabilirlik -------------------------------------------------------
    prefer_single_quotes: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    directives_ordering: true
    sort_child_properties_last: true
    require_trailing_commas: true       # git diff'lerini temiz tutar
    unnecessary_parenthesis: true
    unnecessary_lambdas: true
    use_super_parameters: true
    use_enums: true

    # --- Mimari disiplini ----------------------------------------------------
    # Kütüphane sınırlarını korur: bir feature'ın iç dosyasını
    # 'package:iz/...' yerine göreli yolla import etmeyi engeller.
    always_use_package_imports: true
    avoid_relative_lib_imports: true
    # Public API'ye sızan private tipleri yakalar.
    library_private_types_in_public_api: true
    # Domain katmanında BuildContext taşımayı zorlaştırır.
    use_build_context_synchronously: true

# İZ — sürekli entegrasyon (TR-B-02)
#
# Depo iki uygulama barındırıyor (ADR-B02): iz/ Flutter istemcisi,
# api/ ASP.NET sunucusu. Tek workflow, işler YOL FİLTRESİYLE ayrışıyor —
# yalnız api/ değişen bir PR'da Flutter testleri koşmasın diye.
#
# Flutter sürümü .fvmrc ile AYNI olmak zorunda. Ayrışırsa "yerelde geçiyor,
# CI'da kalıyor" durumu doğar; sürümü değiştirirken İKİSİNİ BİRDEN güncelle.

name: CI

on:
  push:
    branches: [tasarim, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'
  DOTNET_VERSION: '9.0.x'

jobs:
  # ---------------------------------------------------------------------
  kapsam:
    name: Ne değişti
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # ⚠️ ÇIKTI ADLARINDA TÜRKÇE HARF KULLANMA.
    # GitHub Actions'ın ifade dili yalnız [A-Za-z0-9_] kabul ediyor. Buradaki
    # ad "kodüretimi" idi ve workflow bu yüzden GEÇERSİZ sayılıyordu: koşu
    # başlıyor, tek bir iş bile çalışmadan başarısız oluyordu. Hata mesajı
    # iş loglarında görünmediği için "CI hiç koşmadı" sanılmıştı.
    # Tire de kullanma: outputs.kod-uretimi ifadede "kod eksi uretimi" okunur.
    outputs:
      flutter: ${{ steps.bak.outputs.flutter }}
      api: ${{ steps.bak.outputs.api }}
      kod_uretimi: ${{ steps.bak.outputs.kod_uretimi }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: bak
        run: |
          taban="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$taban" ] || [ "$taban" = "0000000000000000000000000000000000000000" ]; then
            # İlk push veya taban bilinmiyor: temkinli davran, hepsini koş.
            echo "flutter=true"     >> "$GITHUB_OUTPUT"
            echo "api=true"         >> "$GITHUB_OUTPUT"
            echo "kod_uretimi=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          degisen=$(git diff --name-only "$taban" HEAD || echo "")
          echo "Değişen dosyalar:"; echo "$degisen"

          es() { echo "$degisen" | grep -qE "$1"; }

          # contracts/ ikisini birden ilgilendirir: sözleşme değiştiyse hem
          # sunucunun ürettiği hem istemcinin tükettiği taraf doğrulanmalı.
          if es '^iz/' || es '^contracts/' ; then echo "flutter=true" >> "$GITHUB_OUTPUT"; else echo "flutter=false" >> "$GITHUB_OUTPUT"; fi
          if es '^api/' || es '^contracts/' ; then echo "api=true"     >> "$GITHUB_OUTPUT"; else echo "api=false"     >> "$GITHUB_OUTPUT"; fi

          # build_runner dakikalar sürüyor; yalnız üretimi etkileyen
          # değişikliklerde koşsun.
          if es 'iz/lib/.*/(data|tables)/|\.drift$|iz/lib/app/database/|iz/pubspec\.(yaml|lock)|build\.yaml'; then
            echo "kod_uretimi=true" >> "$GITHUB_OUTPUT"
          else
            echo "kod_uretimi=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  flutter-analiz-ve-test:
    name: Flutter — analiz ve testler
    needs: kapsam
    if: needs.kapsam.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: iz

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Biçimlendirme
        run: dart format --output=none --set-exit-if-changed .

      - name: Statik analiz
        run: flutter analyze

      - name: Testler
        run: flutter test --reporter=compact

  # ---------------------------------------------------------------------
  mimari-kurallar:
    name: Flutter — mimari kuralları
    needs: kapsam
    if: needs.kapsam.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: iz

    steps:
      - uses: actions/checkout@v4

      # Bu iş Flutter kurmuyor: hepsi metin taraması, saniyeler sürüyor.

      - name: 'TR-C-20 — plan karşılaştırması yasak'
        run: |
          # Entitlement kararı yalnız merkezî matristen okunur.
          if grep -rn --include='*.dart' \
               -E '==\s*IzPlan\.(plus|family)|IzPlan\.(plus|family)\s*==' \
               lib/ | grep -v 'core/entitlement/entitlement.dart'; then
            echo "::error::Plan doğrudan karşılaştırılmış. entitlements.can(...) / .limit(...) kullan."
            exit 1
          fi

      - name: 'TR-C-01 — domain katmanı saf kalmalı'
        run: |
          if grep -rn --include='*.dart' \
               -E "^import 'package:(flutter|drift|dio|http)/" \
               lib/features/*/domain/ 2>/dev/null; then
            echo "::error::domain/ katmanı dış dünya tipini import ediyor."
            exit 1
          fi

      - name: 'TR-C-03 — feature sınırları'
        run: |
          # Bir feature başka feature'ın YALNIZ domain/'ini görebilir.
          # İki meşru istisna: data/ -> data/ tablo referansı (yabancı anahtar
          # ve join için zorunlu) ve *_l10n.dart köprüleri.
          ihlal=0
          for dir in lib/features/*/; do
            ad=$(basename "$dir")
            for sub in domain presentation; do
              [ -d "$dir$sub" ] || continue
              h=$(grep -rn "package:iz/features/[a-z_]*/data/" "$dir$sub" --include='*.dart' 2>/dev/null \
                  | grep -v "features/$ad/data/" || true)
              if [ -n "$h" ]; then echo "$h"; ihlal=1; fi
            done
            h=$(grep -rn "package:iz/features/[a-z_]*/presentation/" "$dir" --include='*.dart' 2>/dev/null \
                | grep -v "features/$ad/presentation/" | grep -vE "_l10n\.dart" || true)
            if [ -n "$h" ]; then echo "$h"; ihlal=1; fi
          done
          [ "$ihlal" -eq 0 ] || { echo "::error::Feature sınırı ihlal edildi (ARCHITECTURE.md §2)."; exit 1; }

      - name: 'TR-C-41 — DateTime.now() doğrudan çağrılmaz'
        run: |
          if grep -rn --include='*.dart' 'DateTime\.now()' lib/ \
             | grep -v 'core/utils/clock.dart' | grep -v '\.g\.dart'; then
            echo "::warning::DateTime.now() doğrudan çağrılmış. Clock enjekte etmeyi düşün."
          fi

  # ---------------------------------------------------------------------
  uretilen-kod:
    name: Flutter — üretilen kod güncel mi
    needs: kapsam
    if: needs.kapsam.outputs.kod_uretimi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: iz

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Kodu yeniden üret
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Fark var mı
        run: |
          # Üretilen dosyalar commit'lenmiş hâlinden farklıysa, birisi tabloyu
          # değiştirip build_runner koşmayı unutmuş demektir.
          if ! git diff --exit-code; then
            echo "::error::Üretilen kod güncel değil. 'dart run build_runner build' koşup commit'le."
            exit 1
          fi

      - name: Şema anlık görüntüsü alınmış mı
        run: |
          # TR-A-02: schemaVersion artırıldıysa drift_schemas/ altında
          # karşılığı olmalı, yoksa migration testi yazılamaz.
          surum=$(grep -oE 'schemaVersion => [0-9]+' lib/app/database/app_database.dart | grep -oE '[0-9]+')
          if [ ! -f "drift_schemas/drift_schema_v${surum}.json" ]; then
            echo "::error::schemaVersion=$surum ama drift_schemas/drift_schema_v${surum}.json yok."
            exit 1
          fi

  # ---------------------------------------------------------------------
  api-derleme-ve-test:
    name: API — derleme ve testler
    needs: kapsam
    if: needs.kapsam.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Bağımlılıklar
        run: dotnet restore

      - name: Araçlar
        # dotnet-ef sürümü .config/dotnet-tools.json ile sabit. Global
        # kuruluma güvenmiyoruz: geliştiricinin makinesindeki sürüm ile
        # CI'ınki ayrıştığı gün migration üretimi sessizce farklılaşır.
        run: dotnet tool restore

      - name: Biçimlendirme
        run: dotnet format --verify-no-changes --no-restore

      - name: Derleme
        # Uyarılar Directory.Build.props'ta hata sayılıyor; ayrıca bayrak gerekmiyor.
        run: dotnet build --no-restore -c Release

      - name: Migration güncel mi
        # Flutter tarafındaki "üretilen kod güncel mi" işinin karşılığı:
        # entity'yi değiştirip migration üretmeyi unutmayı yakalar. Böyle bir
        # değişiklik testlerde görünmez (testler migration'ı koşar, modeli
        # değil) ve ilk fark edildiği yer üretim veritabanı olur.
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Iz.Infrastructure
          --startup-project src/Iz.Infrastructure
          --no-build --configuration Release

      - name: Testler
        # Entegrasyon testleri Testcontainers ile GERÇEK Postgres kaldırıyor.
        # ubuntu-latest koşucusunda Docker hazır geliyor, ek kurulum gerekmiyor.
        run: dotnet test --no-build -c Release --verbosity minimal
